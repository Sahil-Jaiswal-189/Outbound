[unix_http_server]
file=/tmp/outbound-supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/outbound-supervisor.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/outbound-supervisor.sock

[program:ollama]
command=/usr/bin/ollama serve
directory=/app
user=outbound
priority=10
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tabpfn]
command=/opt/venv/bin/python -m uvicorn services.tabpfn_service:app --host 127.0.0.1 --port 8008 --workers 1
directory=/app
user=outbound
priority=20
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:models]
command=/opt/venv/bin/python -m deploy.bootstrap
directory=/app
user=outbound
priority=30
autorestart=unexpected
exitcodes=0
startsecs=0
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:web]
command=/usr/local/bin/node server.mjs
directory=/app
user=outbound
priority=40
autorestart=true
startsecs=2
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
